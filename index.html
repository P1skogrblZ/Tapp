<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T/app</title>
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T/app">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; background: #0A0A0B; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: black ground, gray surfaces, one red accent. A single narrow column with a fixed icon tab bar at the bottom.
   Deliberately one dark look (black / red / gray), so there is no light variant. */
:root {
  --bg: #0A0A0B;
  --surface: #151517;
  --raise: #1F1F22;
  --line: #2D2D31;
  --field: #0E0E10;
  --ink: #F3F3F4;
  --muted: #A1A1A9;
  --dim: #7A7A82;
  --red: #E11D2A;
  --red-hi: #FF5A5F;
  --red-soft: rgba(225, 29, 42, .18);
  --on-red: #FFFFFF;
  --display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --text: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--text);
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
#app { display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: .02em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.lg { width: 30px; height: 30px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 9px; background: var(--red); color: var(--on-red); display: grid; place-items: center; }
.brand h1 { font-size: 28px; letter-spacing: .02em; line-height: 1; }
.brand h1 .sl { color: var(--red-hi); }
.where { font-size: 12px; color: var(--muted); }

button { font: 600 15px var(--text); color: inherit; cursor: pointer; min-height: 44px; border-radius: 10px; border: 1px solid transparent; padding: 0 16px; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
.pri { background: var(--red); color: var(--on-red); }
.pri:active { filter: brightness(.88); }
.wide { width: 100%; min-height: 52px; font-size: 16px; }
.sec { background: var(--raise); border-color: var(--line); }
.ib { width: 44px; padding: 0; background: var(--raise); border-color: var(--line); flex: none; }
.ib.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--raise); border-color: var(--line); font-size: 14px; font-weight: 500; text-align: left; max-width: 100%; }
.chip.on { background: var(--red-soft); border-color: var(--red); color: var(--ink); }
.chip .ic { width: 16px; height: 16px; color: var(--red-hi); }
.danger { background: var(--red); color: var(--on-red); }
@media (hover: hover) {
  .ib.ghost:hover { color: var(--red-hi); }
  .sec:hover, .chip:hover, .ib:hover { border-color: var(--muted); }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.day { position: relative; }
.daynav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.daybtn { min-height: 56px; gap: 12px; color: var(--ink); }
.daybtn .ic { color: var(--muted); }
.daybig { font-family: var(--display); font-weight: 600; line-height: 1; display: flex; align-items: baseline; gap: 10px; text-transform: uppercase; }
.daybig .wd { font-size: 42px; color: var(--red-hi); }
.daybig .dm { font-size: 24px; }
.hidden-date { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.todayrow { display: flex; justify-content: center; margin-top: 10px; }
.week, .plan { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.plan { margin-top: 12px; }
.cell { flex-direction: column; gap: 3px; min-height: 66px; padding: 6px 0; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.cell .w { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.cell .n { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.cell .ic { width: 16px; height: 16px; }
.cell.train .ic { color: var(--red-hi); }
.cell.today .n { color: var(--red-hi); }
.cell.done { background: var(--red); border-color: var(--red); color: var(--on-red); }
.cell.done .n, .cell.done .ic { color: var(--on-red); }
.cell.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.weeknote { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.weeknote b { color: var(--ink); font-weight: 600; }
.type { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.type button { background: var(--raise); border-color: var(--line); color: var(--muted); }
.type button[aria-pressed="true"] { background: var(--red-soft); border-color: var(--red); color: var(--ink); }
.type button[aria-pressed="true"] .ic { color: var(--red-hi); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--raise); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .ic { color: var(--red-hi); }
.stat b { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
.stat span { font-size: 12px; color: var(--muted); }
.exvol { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.exvol .ic { width: 16px; height: 16px; color: var(--red-hi); }
.exvol b { color: var(--ink); font-weight: 600; }
.ic.face { width: 40px; height: 40px; stroke-width: 1.6; }
.ic.face.big { width: 60px; height: 60px; stroke-width: 1.4; }
.fl-sleep, .fl-low { color: var(--muted); }
.fl-ok, .fl-good { color: var(--ink); }
.fl-strong, .fl-beast { color: var(--red-hi); }
.prog { display: flex; align-items: center; gap: 12px; margin: 6px 0 12px; padding: 10px 12px; background: var(--raise); border-radius: 10px; }
.prog .ic.face { width: 38px; height: 38px; }
.prog b { display: block; font-size: 14px; }
.prog span { font-size: 12px; color: var(--muted); }
.nutrow { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
.nutnums { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nutnums b { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; }
.nutnums i { font-style: normal; font-size: 14px; color: var(--muted); margin-left: 6px; font-family: var(--text); font-weight: 400; }
.bar { height: 8px; border-radius: 4px; background: var(--raise); margin-top: 14px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--red); border-radius: 4px; }
.cl li span em { font-style: normal; color: var(--dim); margin: 0 6px; }
.tile .ic.face { width: 30px; height: 30px; }
.toast { display: flex; align-items: center; gap: 10px; }
.toast .ic.face { width: 30px; height: 30px; color: var(--on-red); stroke-width: 1.7; }
.toast[hidden] { display: none; }

.ex header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex h2 { font-size: 22px; text-transform: uppercase; overflow-wrap: anywhere; }
.prev { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.prevrow { margin: 6px 0 4px; display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.lbl .ic { width: 14px; height: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sets { list-style: none; margin: 8px 0 8px; padding: 0; }
.sets li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px; align-items: center; min-height: 46px; border-top: 1px solid var(--line); }
.sets .n { font-family: var(--display); color: var(--red-hi); font-size: 16px; }
.sets .v { font-family: var(--display); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.sets .v i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); margin: 0 2px; }
.exv { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.exv b { color: var(--ink); font-weight: 600; }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
input { width: 100%; min-width: 0; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: 500 16px var(--text); }
input::placeholder { color: var(--dim); }
.stp { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; }
.stp .ib { min-height: 48px; }
.stp input { text-align: center; font-family: var(--display); font-size: 24px; padding: 4px; }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.addcard h2, .kc h2, .sect h2 { font-size: 20px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.addcard h2 .ic, .kc h2 .ic, .sect h2 .ic { color: var(--red-hi); }
.addcard .chips { margin: 12px 0; }

.kc { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kc .tot { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.kc .tot i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); font-weight: 400; margin-left: 4px; }
.cl { list-style: none; margin: 10px 0 12px; padding: 0; }
.cl li { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; min-height: 46px; border-top: 1px solid var(--line); font-family: var(--display); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cl li span i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); margin-left: 4px; }

.empty { text-align: left; padding: 20px 16px; display: flex; gap: 14px; align-items: flex-start; }
.empty .ic { color: var(--red-hi); margin-top: 2px; }
.empty h2 { font-size: 22px; text-transform: uppercase; margin-bottom: 4px; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }

.chiprow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chiprow .chip { flex: none; white-space: nowrap; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border-radius: 0; color: var(--muted); font-size: 13px; padding: 0 6px; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--red-soft); color: var(--ink); box-shadow: inset 0 -3px 0 var(--red); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile .ic { color: var(--red-hi); width: 18px; height: 18px; }
.tile span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile b { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chartbox { padding: 12px 8px 6px; }
.chartbox svg { display: block; width: 100%; height: auto; }
.ax { fill: var(--muted); font: 11px var(--text); }
.axv { fill: var(--ink); font: 600 12px var(--text); }
.note { margin: 6px 8px 8px; font-size: 12px; color: var(--muted); }
.sect { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.sect > span { font-size: 13px; color: var(--muted); text-align: right; }
.bwlist { list-style: none; margin: 10px 0 0; padding: 0; }
.bwlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; align-items: center; gap: 10px; min-height: 46px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.bwlist b { font-family: var(--display); font-weight: 500; font-size: 20px; color: var(--ink); }

.sess { display: flex; flex-direction: column; gap: 10px; }
.sess header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 10px; }
.sess h3 { font-size: 20px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.sess h3 .ic { color: var(--red-hi); }
.sess .vol { font-size: 13px; color: var(--muted); }
.sess ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.sess li { overflow-wrap: anywhere; }
.sess li b { font-weight: 600; display: block; }
.sess li span { color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.note0 { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.warn { margin-top: 12px; padding: 12px; border: 1px solid var(--red); border-radius: 10px; background: var(--red-soft); }
.warn p { margin: 0 0 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: max-content; max-width: min(92vw, 520px); background: var(--red); color: var(--on-red); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .6); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav > div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.nav button { flex-direction: column; gap: 3px; min-height: 56px; padding: 6px 0; color: var(--muted); font: 500 10px var(--text); letter-spacing: .03em; text-transform: uppercase; }
.nav button .ic { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--red-soft); box-shadow: inset 0 3px 0 var(--red); }
.nav button[aria-current="page"] .ic { color: var(--red-hi); }

@media (max-width: 380px) {
  .daybig .wd { font-size: 34px; }
  .daybig .dm { font-size: 20px; }
  .tile b, .stat b { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  button { transition: background-color .12s, border-color .12s, color .12s; }
}

/* foods + scanner */
.food { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
.food .kc { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.food h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .02em; }
.fl { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: stretch; }
.fpick { width: 100%; min-height: 54px; padding: 8px 12px; background: var(--raise); border-color: var(--line); flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; font-weight: 600; }
.fpick span { font-size: 12px; font-weight: 500; color: var(--muted); }
.fnote { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.fnote b { color: var(--ink); font-weight: 600; }
.foodres { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.foodres i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); margin-left: 4px; }
.mn { display: block; font: 500 13px var(--text); color: var(--muted); margin-bottom: 2px; overflow-wrap: anywhere; }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.setrow:first-of-type { border-top: 0; }
.setrow b { font-family: var(--display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.setrow .meter { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.setrow .meter span { display: block; height: 100%; background: var(--red); }
.scan { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.scan video { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
.scan .frame { position: absolute; left: 8%; right: 8%; top: 32%; height: 22%; border: 3px solid var(--red-hi); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; }
.scan .cap { position: absolute; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 16px); margin: 0; color: #fff; font-size: 15px; text-align: center; text-shadow: 0 1px 4px #000; }
.scan .x { margin: 12px 16px; }

/* minimal layout */
#app { gap: 10px !important; }
.daybig .wd { font-size: 30px; }
.daybig .dm { font-size: 20px; }
.daybtn { min-height: 48px; }
.week { margin-top: 10px; gap: 4px; }
.cell { min-height: 54px; gap: 2px; padding: 4px 0; }
.cell .n { font-size: 18px; }
.cell .ic { width: 14px; height: 14px; }
.weeknote { margin: 8px 0 0; }
.dayl { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
.dayl b { color: var(--ink); font-family: var(--display); font-size: 20px; font-weight: 600; }
.linkbtn { min-height: 36px; padding: 0 2px; color: var(--muted); font-weight: 500; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; display: inline-flex; }
.card.empty { flex-wrap: wrap; align-items: center; }
.empty .sec { margin-left: auto; flex: none; }
.ex header h2 { font-size: 18px; }
.ex .wk { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.ex header { gap: 6px; }
.prev { margin: 2px 0 6px; }
.sets { margin: 4px 0 6px; }
.sets li { min-height: 40px; }
.sets .v { font-size: 20px; }
.prog { margin: 2px 0 8px; padding: 8px 10px; gap: 10px; }
.prog .ic.face { width: 28px; height: 28px; }
.fold { padding: 0; overflow: hidden; }
.fold .fh { width: 100%; min-height: 54px; padding: 0 14px; border-radius: 0; justify-content: flex-start; gap: 12px; font-size: 16px; }
.fold .fh > .ic:not(.face):not(.chev) { color: var(--red-hi); width: 22px; height: 22px; }
.fold .fh .face { width: 30px; height: 30px; }
.fold .fh .t { flex: none; }
.fold .fh .s { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-weight: 500; font-size: 13px; text-align: right; }
.fold .fh .chev { width: 16px; height: 16px; color: var(--muted); flex: none; transition: transform .15s; }
.fold.open .fh .chev { transform: rotate(90deg); }
.fold .fb { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.fold .fb > * { margin-top: 0; margin-bottom: 0; }
.fold .fb .food { margin: 0; }
.fold .fb .cl { margin: 0; }
.fold .fb .bar { margin-top: 0; }
.fold .fb .plan { margin-top: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; }
.mrow .ib { min-height: 48px; width: 48px; background: var(--red); border-color: var(--red); color: var(--on-red); }
.mrow .ib .ic { color: var(--on-red); }
.sub { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.fold .chartbox { padding: 6px 0 0; }
.fold .tile { background: var(--raise); }

/* motivation */
.duo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 12px 14px; }
.duo .streak { display: flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.duo .streak .ic { width: 32px; height: 32px; color: var(--red-hi); }
.duo .streak.off .ic { color: var(--muted); }
.duo .streak small { display: block; font: 500 11px var(--text); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
.duo .lv { min-width: 0; }
.duo .lv b { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
.duo .lv b span { color: var(--muted); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.duo .lv .bar { margin-top: 8px; height: 8px; }
.duo .hint { grid-column: 1 / -1; margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.duo .hint b { color: var(--ink); font-weight: 600; }
.fin { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; overflow-y: auto; }
.fin .ic.face { width: 104px; height: 104px; color: var(--red-hi); stroke-width: 1.5; }
.fin h2 { font-size: 30px; }
.fin p { margin: 0; color: var(--muted); font-size: 15px; }
.fin .st { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; }
.fin .st div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; }
.fin .st b { display: block; font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fin .st span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fin .st .hot b { color: var(--red-hi); }
.fin .lvbox { width: 100%; max-width: 420px; text-align: left; }
.fin .lvbox b { display: flex; justify-content: space-between; font-size: 15px; }
.fin .lvbox b span { color: var(--muted); font-weight: 500; font-size: 13px; }
.fin .lvbox .bar { margin-top: 8px; }
.fin .pri { max-width: 420px; width: 100%; }
.awgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.aw { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.aw .ic { width: 22px; height: 22px; color: var(--red-hi); }
.aw b { font-size: 14px; font-weight: 600; }
.aw span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.aw.lock { opacity: .55; }
.aw.lock .ic { color: var(--muted); }
.aw .bar { margin-top: 4px; height: 5px; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  .fin .ic.face { animation: pop .5s ease-out; }
}
/* v2: target, rest timer, programs */
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.goal { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; font-size: 14px; }
.goal .ic { width: 18px; height: 18px; color: var(--red-hi); flex: none; }
.goal b { white-space: nowrap; font-family: var(--display); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.goal span { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; max-width: 48%; }
.goal.hit { border-style: solid; border-color: var(--red); }
.rtimer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); z-index: 21; width: min(92vw, 420px); background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .6); }
.rtimer[hidden] { display: none; }
.rtimer .t { font-family: var(--display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 72px; }
.rtimer .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
@media (max-width: 440px) { .rtimer .l { display: none; } .rtimer .sp { flex: 1; } }
.rtimer button { min-height: 40px; padding: 0 12px; }
.rtimer.go { border-color: var(--red); }
.rtimer.go .t { color: var(--red-hi); }
.rtimer .bar { position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; margin: 0; }
.progrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: stretch; }
.progbtn { min-height: 54px; padding: 8px 12px; background: var(--raise); border-color: var(--line); flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; font-weight: 600; width: 100%; }
.progbtn span { font-size: 12px; font-weight: 500; color: var(--muted); }

.nutsum { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.nutsum .ic.face { width: 44px; height: 44px; flex: none; }

.mmfig { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: var(--raise); border-radius: 12px; padding: 12px 8px 8px; }

.mmfig svg { width: 100%; max-width: 170px; height: auto; display: block; margin: 0 auto; }
.mmfig figcaption { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
.mmfig .bd { fill: #25252a; }
.mmfig .mu { stroke: var(--raise); stroke-width: .7; }

.mmfig .mu1 { fill: #6B1B22; }

.mmleg .mu0 { background: #34343a; } .mmleg .mu1 { background: #6B1B22; } .mmleg .mu2 { background: var(--red); } .mmleg .mu3 { background: var(--red-hi); }
.mmrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
.mmrow:first-child { border-top: 0; }
.mmrow b { font-family: var(--display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

.mmrow .meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.mmrow .meter span { display: block; height: 100%; background: var(--red); }
.mmex { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.mmex select { min-height: 44px; width: 100%; background: var(--raise); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; font: inherit; }
/* nutrition 2.2 */
.mrow { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.mrow .ib { grid-column: 1 / -1; width: 100%; gap: 8px; font-weight: 600; }
.macs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.mm { display: block; font: 500 13px var(--text); color: var(--muted); margin-top: 2px; }
.cl li span .mm { margin-left: 0; }

.nlist { display: flex; flex-direction: column; }
.nrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; width: 100%; min-height: 0; padding: 12px 0; background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; text-align: left; color: var(--ink); font-weight: 400; }

.legend i:first-child { margin-left: 0; }
.legend small { margin-left: auto; font-size: 12px; color: var(--dim); }
.ing { margin: 0 !important; }
.nutbody .cl li, .ing li { padding: 8px 0; }
.nutbody .cl li:first-child { border-top: 0; padding-top: 0; }
/* muscle picker */
.chip.half { border-style: dashed; border-color: var(--red); background: transparent; color: var(--ink); }
.purp { margin: -4px 0 0; font-size: 13px; color: var(--muted); }
.pend { display: flex; flex-direction: column; gap: 12px; border-color: var(--red); }

.grp { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pend .chips { margin-top: -6px; }
</style>

<script>
(function () {
  var PRESETS = ['Подтягивания с весом', 'Жим лёжа', 'Жим гантелей на наклонной скамье', 'Жим стоя', 'Махи гантелей в стороны', 'Тяга штанги в наклоне', 'Приседания', 'Становая тяга'];
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var LS_KEY = 'trainlog-v1';
  var BK_KEY = 'trainlog-backup';

  var app = document.getElementById('app');
  var nav = document.getElementById('nav');

  function ic(n, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dstr(new Date()); }
  function pd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmtShort(s) { var d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function fmtNum(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10).replace('.', ','); }
  function fmtInt(n) { return Math.round(n).toLocaleString('ru-RU'); }
  function num(s) { return parseFloat(String(s).replace(',', '.')); }
  function e1rm(kg, reps) { return reps <= 1 ? kg : kg * (1 + reps / 30); }
  function fmtSet(st) { return fmtNum(st.kg) + ' × ' + st.reps; }
  function fmtSets(sets) {
    var out = [], i = 0;
    while (i < sets.length) {
      var j = i;
      while (j + 1 < sets.length && sets[j + 1].kg === sets[i].kg && sets[j + 1].reps === sets[i].reps) j++;
      out.push(fmtSet(sets[i]) + (j > i ? ' ×' + (j - i + 1) : ''));
      i = j + 1;
    }
    return out.join(' · ');
  }

  var state = { sessions: {}, body: [], cal: {}, plan: defaultPlan(), goals: { protein: 0, kcal: 0, fat: 0, carbs: 0 }, foods: [], recipes: [], programs: [], mmap: {} };
  var ui = { tab: 'today', date: todayStr(), metric: 'e1rm', exercise: null, drafts: {}, newEx: '', bwKg: '', kcalIn: '', protIn: '', goalEdit: false, fold: {}, confirmDel: null, importPending: null, loaded: false, progName: '', mmDays: 7, foodOpen: false, foodQ: '', foodSel: null, foodG: '', foodNew: false, nf: { n: '', k: '', p: '', f: '', c: '', bc: '' }, nfNote: '', codeIn: '', fatIn: '', carbIn: '', gd: { k: '', p: '', f: '', c: '' }, nutRange: 14, nutMetric: 'k', recMode: '', rec: null, pend: null };
  var msgTimer = null;
  var installEvt = null;

  /* ---------- messages ---------- */
  function setMsg(t, lvl) {
    var el = document.getElementById('msg');
    el.innerHTML = (lvl && t ? face(lvl) : '') + '<span>' + esc(t) + '</span>';
    el.hidden = !t;
    clearTimeout(msgTimer);
    if (t) msgTimer = setTimeout(function () { el.hidden = true; el.textContent = ''; }, 4500);
  }
  /* ---------- persistence (память браузера) ---------- */
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { setMsg('Не удалось сохранить: память браузера недоступна или заполнена. Сохрани копию на вкладке «История».'); }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var v = JSON.parse(raw); if (v && v.sessions) state = { sessions: v.sessions, body: v.body || [], cal: v.cal || {}, plan: cleanPlan(v.plan), goals: cleanGoals(v.goals), foods: cleanFoods(v.foods), recipes: cleanRecipes(v.recipes), programs: cleanPrograms(v.programs), mmap: cleanMmap(v.mmap) }; }
    } catch (e) { /* пустой журнал */ }
  }
  function persistSession(date) {
    var s = state.sessions[date];
    if (s && !s.exercises.length) delete state.sessions[date];
    saveLocal();
  }
  function persistBody() { saveLocal(); }
  function persistCal() { saveLocal(); }
  function persistPlan() { saveLocal(); }
  function persistGoals() { saveLocal(); }
  function persistFoods() { saveLocal(); }
  function persistRecipes() { saveLocal(); }
  function persistPrograms() { saveLocal(); }
  function persistMmap() { saveLocal(); }
  function defaultPlan() { return { week: ['rest', 'train', 'rest', 'train', 'rest', 'train', 'rest'], days: {} }; }
  function cleanPlan(p) {
    var d = defaultPlan();
    if (p && Array.isArray(p.week) && p.week.length === 7) d.week = p.week.map(function (x) { return x === 'train' ? 'train' : 'rest'; });
    if (p && p.days && typeof p.days === 'object') Object.keys(p.days).forEach(function (k) { if (p.days[k] === 'train' || p.days[k] === 'rest') d.days[k] = p.days[k]; });

      ui.pend = { name: en, p: em.p.slice(), s: em.s.slice(), auto: eg.known ? eg : null, edit: true };
      render(); window.scrollTo(0, 0);
    }
    else if (a === 'mmtoggle' && ui.pend) {
      var tg = b.dataset.g, tq = ui.pend, ip = tq.p.indexOf(tg), is = tq.s.indexOf(tg);
      if (ip >= 0) { tq.p.splice(ip, 1); tq.s.push(tg); }
      else if (is >= 0) tq.s.splice(is, 1);
      else tq.p.push(tg);
      render();
    }
    else if (a === 'pendno') { ui.pend = null; render(); }
    else if (a === 'pendsave' && ui.pend) {
      var pq = ui.pend;
      if (!pq.p.length) { setMsg('Выбери хотя бы одну основную мышцу.'); return; }
      state.mmap[pq.name] = { p: pq.p.slice(), s: pq.s.slice() };
      persistMmap();
      if (!pq.edit) {
        if (!ensure(ui.date).exercises.some(function (x) { return x.name.toLowerCase() === pq.name.toLowerCase(); })) addExerciseDirect(pq.name);
        ui.newEx = '';
      }
      ui.pend = null; render();
      setMsg(pq.edit ? 'Мышцы сохранены: ' + pq.name + '.' : 'Добавлено: ' + pq.name + '.');
    }
    else if (a === 'addquick') { if (addExercise(b.dataset.n)) render(); }
    else if (a === 'addex') { if (addExercise(ui.newEx)) { ui.newEx = ''; render(); } }
    else if (a === 'metric') { ui.metric = b.dataset.m; render(); }
    else if (a === 'pickex') { ui.exercise = b.dataset.n; render(); }
    else if (a === 'bwadd') {
      var kg = num(ui.bwKg);
      if (isNaN(kg) || kg < 20 || kg > 400) { setMsg('Проверь вес тела: нужно число от 20 до 400.'); return; }
      var t = todayStr();
      state.body = state.body.filter(function (x) { return x.date !== t; });
      state.body.push({ date: t, kg: Math.round(kg * 10) / 10 });
      ui.bwKg = '';
      persistBody();
      render();
    }
    else if (a === 'bwdel') { state.body.splice(+b.dataset.k, 1); persistBody(); render(); }
    else if (a === 'kadd') {
      function nv(t) { return t.trim() === '' ? 0 : num(t); }
      var kk = nv(ui.kcalIn), pp = nv(ui.protIn), ff = nv(ui.fatIn), cc = nv(ui.carbIn);
      if ([kk, pp, ff, cc].some(isNaN)) { setMsg('Впиши числа. Дробные можно через запятую.'); return; }
      if (addMeal({ k: kk, p: pp, f: ff, c: cc })) { ui.kcalIn = ''; ui.protIn = ''; ui.fatIn = ''; ui.carbIn = ''; render(); }
    }
    else if (a === 'goaledit') {
      var gg = state.goals;
      ui.gd = { k: gg.kcal ? String(gg.kcal) : '', p: gg.protein ? String(gg.protein) : '', f: gg.fat ? String(gg.fat) : '', c: gg.carbs ? String(gg.carbs) : '' };
      ui.goalEdit = true; render();
    }
    else if (a === 'goalno') { ui.goalEdit = false; render(); }
    else if (a === 'goalreset') { state.goals = cleanGoals(null); ui.goalEdit = false; persistGoals(); render(); }
    else if (a === 'goalcalc') {
      var lw = state.body.slice().sort(function (x, y) { return x.date < y.date ? -1 : 1; }).pop();
      if (!lw) { setMsg('Сначала запиши свой вес на вкладке «Прогресс».'); return; }
      var gm = +b.dataset.m, bw = lw.kg, k0 = bw * 33 * (gm < 0 ? 0.85 : gm > 0 ? 1.1 : 1);
      var gk = Math.round(k0 / 50) * 50, gp = Math.round(bw * 2 / 5) * 5, gf = Math.round(bw / 5) * 5, gc = Math.max(0, Math.round((gk - 4 * gp - 9 * gf) / 20) * 5);
      ui.gd = { k: String(gk), p: String(gp), f: String(gf), c: String(gc) };
      render();
    }
    else if (a === 'goalsave') {
      var out = {}, bad = '';
      [['k', 'kcal', 800, 10000, 'Ккал'], ['p', 'protein', 20, 600, 'Белок'], ['f', 'fat', 10, 400, 'Жиры'], ['c', 'carbs', 20, 1000, 'Углеводы']].forEach(function (q) {
        var t = String(ui.gd[q[0]]).trim();
        if (t === '') { out[q[1]] = 0; return; }
        var v = Math.round(num(t));
        if (isNaN(v) || v < q[2] || v > q[3]) bad = bad || (q[4] + ': число от ' + q[2] + ' до ' + q[3] + '.');
        else out[q[1]] = v;
      });
      if (bad) { setMsg(bad); return; }
      state.goals = cleanGoals(out); ui.goalEdit = false; persistGoals(); render();
    }
    else if (a === 'nutrange') { ui.nutRange = [7, 14, 30].indexOf(+b.dataset.r) >= 0 ? +b.dataset.r : 14; render(); }
    else if (a === 'nutmetric') { ui.nutMetric = b.dataset.m; render(); }
    else if (a === 'nutopen') { ui.date = b.dataset.d; render(); window.scrollTo(0, 0); }
    else if (a === 'reclist') { ui.recMode = 'list'; ui.rec = null; render(); }
    else if (a === 'recback') { ui.recMode = ''; ui.rec = null; render(); }
    else if (a === 'recnew') { ui.recMode = 'edit'; ui.rec = { id: '', n: '', por: '1', w: '', ing: [], q: '', sel: null, g: '' }; render(); }
    else if (a === 'recedit') {
      var er = state.recipes.filter(function (x) { return x.id === b.dataset.id; })[0];
      if (er) { ui.recMode = 'edit'; ui.rec = { id: er.id, n: er.n, por: String(er.portions).replace('.', ','), w: er.w ? String(er.w) : '', ing: JSON.parse(JSON.stringify(er.ing)), q: '', sel: null, g: '' }; render(); }
    }
    else if (a === 'recdel') { state.recipes = state.recipes.filter(function (x) { return x.id !== b.dataset.id; }); persistRecipes(); render(); }
    else if (a === 'recuse') { var ur = findFood(b.dataset.id); if (ur) { ui.recMode = ''; ui.rec = null; ui.foodSel = ur.id; ui.foodG = String(ur.ug); render(); } }
    else if (a === 'ringpick') { ui.rec.sel = b.dataset.id; ui.rec.g = ''; render(); }
    else if (a === 'ringno') { ui.rec.sel = null; render(); }
    else if (a === 'ringg') { ui.rec.g = b.dataset.g; var rgi = document.getElementById('rc-g'); if (rgi) rgi.value = ui.rec.g; }
    else if (a === 'ringadd') {
      var rf = findFood(ui.rec.sel), rg = num(ui.rec.g);
      if (!rf) return;
      if (isNaN(rg) || rg < 1 || rg > 5000) { setMsg('Впиши вес ингредиента: число граммов от 1 до 5000.'); return; }
      var rm = rg / 100;
      ui.rec.ing.push({ n: rf.n, g: Math.round(rg), k: r1(rf.k * rm), p: r1((rf.p || 0) * rm), f: r1((rf.f || 0) * rm), c: r1((rf.c || 0) * rm) });
      ui.rec.sel = null; ui.rec.q = ''; ui.rec.g = ''; render();
    }
    else if (a === 'ringdel') { ui.rec.ing.splice(+b.dataset.i, 1); render(); }
    else if (a === 'recsave') {
      var rc = ui.rec, rn = rc.n.trim().replace(/\s+/g, ' '), rp = num(rc.por), rw = rc.w.trim() === '' ? 0 : num(rc.w);
      if (!rn) { setMsg('Впиши название рецепта.'); return; }
      if (!rc.ing.length) { setMsg('Добавь хотя бы один ингредиент.'); return; }
      if (isNaN(rp) || rp < 0.5 || rp > 100) { setMsg('Число порций: от 0,5 до 100.'); return; }
      if (isNaN(rw) || (rw !== 0 && (rw < 10 || rw > 20000))) { setMsg('Вес готового блюда: от 10 до 20000 г, или оставь пустым.'); return; }
      var ro = { id: rc.id || 'r' + Date.now().toString(36), n: rn, portions: rp, w: Math.round(rw), ing: JSON.parse(JSON.stringify(rc.ing)) };
      var ri = -1; state.recipes.forEach(function (x, i) { if (x.id === ro.id) ri = i; });
      if (ri >= 0) state.recipes[ri] = ro; else state.recipes.push(ro);
      persistRecipes(); ui.rec = null; ui.recMode = 'list'; render();
      setMsg('Рецепт сохранён: ' + rn + '.');
    }
    else if (a === 'finish') finishView();
    else if (a === 'mmdays') { ui.mmDays = +b.dataset.d === 30 ? 30 : 7; render(); }
    else if (a === 'restcycle') cycleRest();
    else if (a === 'restskip') restStop();
    else if (a === 'restadd') restAdd(+b.dataset.n);
    else if (a === 'startprog') startProgram(b.dataset.id);
    else if (a === 'progsave') saveProgram();
    else if (a === 'progdel') { state.programs = state.programs.filter(function (q) { return q.id !== b.dataset.id; }); persistPrograms(); render(); }
    else if (a === 'fold') { var fk = b.dataset.k; ui.fold[fk] = !isOpen(fk, b.dataset.def === '1'); render(); }
    else if (a === 'kquick') { if (addMeal({ k: +b.dataset.k, p: +b.dataset.p, f: +b.dataset.f, c: +b.dataset.c })) render(); }
    else if (a === 'foodtoggle') { ui.foodOpen = !ui.foodOpen; if (!ui.foodOpen) { ui.foodSel = null; ui.foodNew = false; ui.foodQ = ''; ui.recMode = ''; ui.rec = null; } render(); }
    else if (a === 'foodpick') { var pf = findFood(b.dataset.id); if (pf) { ui.foodSel = pf.id; ui.foodG = String(pf.ug || 100); render(); } }
    else if (a === 'foodback') { ui.foodSel = null; ui.foodNew = false; ui.nfNote = ''; render(); }
    else if (a === 'foodunit') { ui.foodG = b.dataset.g; var uf = findFood(ui.foodSel); var gi = document.getElementById('food-g'); if (gi) gi.value = ui.foodG; var fr = document.getElementById('food-res'); if (fr && uf) fr.innerHTML = foodRes(uf); }
    else if (a === 'foodadd') {
      var af = findFood(ui.foodSel), ag = foodGrams();
      if (!af) return;
      if (!ag || ag > 5000) { setMsg('Впиши вес порции: число граммов от 1 до 5000.'); return; }
      if (addMeal({ k: af.k * ag / 100, p: af.p * ag / 100, f: (af.f || 0) * ag / 100, c: (af.c || 0) * ag / 100, n: af.n, g: ag })) { ui.foodSel = null; ui.foodQ = ''; ui.foodG = ''; render(); }
    }
    else if (a === 'foodnew') { ui.foodNew = true; ui.foodSel = null; ui.nf = { n: ui.foodQ.trim(), k: '', p: '', f: '', c: '', bc: '' }; ui.nfNote = ''; render(); }
    else if (a === 'foodsave') saveFood();
    else if (a === 'fooddel') {
      state.foods = state.foods.filter(function (f) { return f.id !== b.dataset.id; });
      persistFoods(); render();
    }
    else if (a === 'scan') startScan(handleCode);
    else if (a === 'codefind') handleCode(ui.codeIn);
    else if (a === 'kdel') {
      var ka = state.cal[ui.date];
      if (ka) { ka.splice(+b.dataset.k, 1); if (!ka.length) delete state.cal[ui.date]; }
      persistCal();
      render();
    }
    else if (a === 'export') exportData();
    else if (a === 'import') document.getElementById('import-file').click();
    else if (a === 'importyes') {
      state = ui.importPending; ui.importPending = null; ui.drafts = {};
      saveLocal(); setMsg('Данные загружены.'); render();
    }
    else if (a === 'importno') { ui.importPending = null; render(); }
    else if (a === 'install') {
      if (installEvt) { var ev = installEvt; ev.prompt(); ev.userChoice.then(function () { installEvt = null; render(); }); }
    }
    else if (a === 'opendate') { ui.date = b.dataset.d; ui.tab = 'today'; render(); window.scrollTo(0, 0); }
    else if (a === 'delask') { ui.confirmDel = b.dataset.d; render(); }
    else if (a === 'delno') { ui.confirmDel = null; render(); }
    else if (a === 'delyes') {
      var d = b.dataset.d;
      if (state.sessions[d]) state.sessions[d].exercises = [];
      ui.confirmDel = null;
      persistSession(d);
      render();
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.mm !== undefined && MM_IDS.indexOf(t.value) >= 0) { state.mmap[t.dataset.mm] = t.value; persistMmap(); render(); }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id || '';
    if (id.indexOf('kg-') === 0 || id.indexOf('rp-') === 0) updateDraft(+id.slice(3));
    else if (id === 'new-ex') ui.newEx = e.target.value;
    else if (id === 'bw-kg') ui.bwKg = e.target.value;
    else if (id === 'kcal-in') ui.kcalIn = e.target.value;
    else if (id === 'prot-in') ui.protIn = e.target.value;
    else if (id === 'fat-in') ui.fatIn = e.target.value;
    else if (id === 'carb-in') ui.carbIn = e.target.value;
    else if (id.indexOf('goal-') === 0 && ui.gd[id.slice(5)] !== undefined) ui.gd[id.slice(5)] = e.target.value;
    else if (id === 'rc-n' && ui.rec) ui.rec.n = e.target.value;
    else if (id === 'rc-por' && ui.rec) { ui.rec.por = e.target.value; var rt = document.getElementById('rc-tot'); if (rt) rt.innerHTML = recSummary(); }
    else if (id === 'rc-w' && ui.rec) { ui.rec.w = e.target.value; var rt2 = document.getElementById('rc-tot'); if (rt2) rt2.innerHTML = recSummary(); }
    else if (id === 'rc-g' && ui.rec) ui.rec.g = e.target.value;
    else if (id === 'rc-q' && ui.rec) { ui.rec.q = e.target.value; var rl = document.getElementById('rc-list'); if (rl) rl.innerHTML = recRows(); }
    else if (id === 'food-q') { ui.foodQ = e.target.value; var fl = document.getElementById('food-list'); if (fl) fl.innerHTML = foodRows(); }
    else if (id === 'food-g') { ui.foodG = e.target.value; var cf = findFood(ui.foodSel), rs = document.getElementById('food-res'); if (cf && rs) rs.innerHTML = foodRes(cf); }
    else if (id === 'nf-n') ui.nf.n = e.target.value;
    else if (id === 'nf-k') ui.nf.k = e.target.value;
    else if (id === 'nf-p') ui.nf.p = e.target.value;
    else if (id === 'nf-f') ui.nf.f = e.target.value;
    else if (id === 'nf-c') ui.nf.c = e.target.value;
    else if (id === 'nf-b') ui.nf.bc = e.target.value;
    else if (id === 'code-in') ui.codeIn = e.target.value;
    else if (id === 'prog-name') ui.progName = e.target.value;
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'date-input' && e.target.value) { ui.date = e.target.value; render(); }
    else if (e.target.id === 'import-file') readImport(e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var id = e.target.id || '';
    if (id.indexOf('kg-') === 0 || id.indexOf('rp-') === 0) { e.preventDefault(); addSet(+id.slice(3)); }
    else if (id === 'new-ex' || id === 'bw-kg' || id === 'kcal-in' || id === 'prot-in' || id === 'fat-in' || id === 'carb-in' || id.indexOf('goal-') === 0 || id === 'rc-g' || id === 'rc-w' || id === 'food-g' || id === 'prog-name' || id === 'code-in' || id === 'nf-b') {
      e.preventDefault();
      var btn = document.querySelector('[data-act="' + ({ 'new-ex': 'addex', 'bw-kg': 'bwadd', 'kcal-in': 'kadd', 'prot-in': 'kadd', 'fat-in': 'kadd', 'carb-in': 'kadd', 'goal-k': 'goalsave', 'goal-p': 'goalsave', 'goal-f': 'goalsave', 'goal-c': 'goalsave', 'rc-g': 'ringadd', 'rc-w': 'recsave', 'food-g': 'foodadd', 'code-in': 'codefind', 'prog-name': 'progsave', 'nf-b': 'foodsave' })[id] + '"]');
      if (btn) btn.click();
    }
  });

  /* ---------- start ---------- */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (ui.loaded && ui.tab === 'history') render(); });
  window.addEventListener('appinstalled', function () { installEvt = null; if (ui.loaded) render(); });

  function init() {
    loadLocal();
    ui.loaded = true;
    render();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* не страшно */ }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* без офлайн-режима */ }); });
    }
  }
  init();
})();
</script>
</body>
</html>
