<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировочный журнал</title>
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; background: #0A0A0B; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: black ground, gray surfaces, one red accent. A single narrow column with a fixed icon tab bar at the bottom.
   Deliberately one dark look (black / red / gray), so there is no light variant. */
:root {
  --bg: #0A0A0B;
  --surface: #151517;
  --raise: #1F1F22;
  --line: #2D2D31;
  --field: #0E0E10;
  --ink: #F3F3F4;
  --muted: #A1A1A9;
  --dim: #7A7A82;
  --red: #E11D2A;
  --red-hi: #FF5A5F;
  --red-soft: rgba(225, 29, 42, .18);
  --on-red: #FFFFFF;
  --display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --text: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--text);
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
#app { display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: .02em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.lg { width: 30px; height: 30px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 9px; background: var(--red); color: var(--on-red); display: grid; place-items: center; }
.brand h1 { font-size: 20px; text-transform: uppercase; letter-spacing: .12em; }
.where { font-size: 12px; color: var(--muted); }

button { font: 600 15px var(--text); color: inherit; cursor: pointer; min-height: 44px; border-radius: 10px; border: 1px solid transparent; padding: 0 16px; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
.pri { background: var(--red); color: var(--on-red); }
.pri:active { filter: brightness(.88); }
.wide { width: 100%; min-height: 52px; font-size: 16px; }
.sec { background: var(--raise); border-color: var(--line); }
.ib { width: 44px; padding: 0; background: var(--raise); border-color: var(--line); flex: none; }
.ib.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--raise); border-color: var(--line); font-size: 14px; font-weight: 500; text-align: left; max-width: 100%; }
.chip.on { background: var(--red-soft); border-color: var(--red); color: var(--ink); }
.chip .ic { width: 16px; height: 16px; color: var(--red-hi); }
.danger { background: var(--red); color: var(--on-red); }
@media (hover: hover) {
  .ib.ghost:hover { color: var(--red-hi); }
  .sec:hover, .chip:hover, .ib:hover { border-color: var(--muted); }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.day { position: relative; }
.daynav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.daybtn { min-height: 56px; gap: 12px; color: var(--ink); }
.daybtn .ic { color: var(--muted); }
.daybig { font-family: var(--display); font-weight: 600; line-height: 1; display: flex; align-items: baseline; gap: 10px; text-transform: uppercase; }
.daybig .wd { font-size: 42px; color: var(--red-hi); }
.daybig .dm { font-size: 24px; }
.hidden-date { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.todayrow { display: flex; justify-content: center; margin-top: 10px; }
.week, .plan { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.plan { margin-top: 12px; }
.cell { flex-direction: column; gap: 3px; min-height: 66px; padding: 6px 0; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.cell .w { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.cell .n { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.cell .ic { width: 16px; height: 16px; }
.cell.train .ic { color: var(--red-hi); }
.cell.today .n { color: var(--red-hi); }
.cell.done { background: var(--red); border-color: var(--red); color: var(--on-red); }
.cell.done .n, .cell.done .ic { color: var(--on-red); }
.cell.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.weeknote { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.weeknote b { color: var(--ink); font-weight: 600; }
.type { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.type button { background: var(--raise); border-color: var(--line); color: var(--muted); }
.type button[aria-pressed="true"] { background: var(--red-soft); border-color: var(--red); color: var(--ink); }
.type button[aria-pressed="true"] .ic { color: var(--red-hi); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--raise); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .ic { color: var(--red-hi); }
.stat b { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
.stat span { font-size: 12px; color: var(--muted); }
.exvol { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.exvol .ic { width: 16px; height: 16px; color: var(--red-hi); }
.exvol b { color: var(--ink); font-weight: 600; }

.ex header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex h2 { font-size: 22px; text-transform: uppercase; overflow-wrap: anywhere; }
.prev { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.prevrow { margin: 6px 0 4px; display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.lbl .ic { width: 14px; height: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sets { list-style: none; margin: 8px 0 8px; padding: 0; }
.sets li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px; align-items: center; min-height: 46px; border-top: 1px solid var(--line); }
.sets .n { font-family: var(--display); color: var(--red-hi); font-size: 16px; }
.sets .v { font-family: var(--display); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.sets .v i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); margin: 0 2px; }
.exv { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.exv b { color: var(--ink); font-weight: 600; }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
input { width: 100%; min-width: 0; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: 500 16px var(--text); }
input::placeholder { color: var(--dim); }
.stp { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; }
.stp .ib { min-height: 48px; }
.stp input { text-align: center; font-family: var(--display); font-size: 24px; padding: 4px; }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.addcard h2, .kc h2, .sect h2 { font-size: 20px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.addcard h2 .ic, .kc h2 .ic, .sect h2 .ic { color: var(--red-hi); }
.addcard .chips { margin: 12px 0; }

.kc { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kc .tot { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.kc .tot i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); font-weight: 400; margin-left: 4px; }
.cl { list-style: none; margin: 10px 0 12px; padding: 0; }
.cl li { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; min-height: 46px; border-top: 1px solid var(--line); font-family: var(--display); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cl li span i { font-style: normal; font-size: 14px; color: var(--muted); font-family: var(--text); margin-left: 4px; }

.empty { text-align: left; padding: 20px 16px; display: flex; gap: 14px; align-items: flex-start; }
.empty .ic { color: var(--red-hi); margin-top: 2px; }
.empty h2 { font-size: 22px; text-transform: uppercase; margin-bottom: 4px; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }

.chiprow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chiprow .chip { flex: none; white-space: nowrap; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border-radius: 0; color: var(--muted); font-size: 13px; padding: 0 6px; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--red-soft); color: var(--ink); box-shadow: inset 0 -3px 0 var(--red); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile .ic { color: var(--red-hi); width: 18px; height: 18px; }
.tile span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile b { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chartbox { padding: 12px 8px 6px; }
.chartbox svg { display: block; width: 100%; height: auto; }
.ax { fill: var(--muted); font: 11px var(--text); }
.axv { fill: var(--ink); font: 600 12px var(--text); }
.note { margin: 6px 8px 8px; font-size: 12px; color: var(--muted); }
.sect { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.sect > span { font-size: 13px; color: var(--muted); text-align: right; }
.bwlist { list-style: none; margin: 10px 0 0; padding: 0; }
.bwlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; align-items: center; gap: 10px; min-height: 46px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.bwlist b { font-family: var(--display); font-weight: 500; font-size: 20px; color: var(--ink); }

.sess { display: flex; flex-direction: column; gap: 10px; }
.sess header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 10px; }
.sess h3 { font-size: 20px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.sess h3 .ic { color: var(--red-hi); }
.sess .vol { font-size: 13px; color: var(--muted); }
.sess ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.sess li { overflow-wrap: anywhere; }
.sess li b { font-weight: 600; display: block; }
.sess li span { color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.note0 { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.warn { margin-top: 12px; padding: 12px; border: 1px solid var(--red); border-radius: 10px; background: var(--red-soft); }
.warn p { margin: 0 0 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: max-content; max-width: min(92vw, 520px); background: var(--red); color: var(--on-red); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .6); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav > div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nav button { flex-direction: column; gap: 3px; min-height: 56px; padding: 6px 4px; color: var(--muted); font: 500 12px var(--text); letter-spacing: .08em; text-transform: uppercase; }
.nav button .ic { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--red-soft); box-shadow: inset 0 3px 0 var(--red); }
.nav button[aria-current="page"] .ic { color: var(--red-hi); }

@media (max-width: 380px) {
  .daybig .wd { font-size: 34px; }
  .daybig .dm { font-size: 20px; }
  .tile b, .stat b { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  button { transition: background-color .12s, border-color .12s, color .12s; }
}
</style>
</head>

<script>
(function () {
  var PRESETS = ['Подтягивания с весом', 'Жим лёжа', 'Жим гантелей на наклонной скамье', 'Жим стоя', 'Махи гантелей в стороны', 'Тяга штанги в наклоне', 'Приседания', 'Становая тяга'];
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var LS_KEY = 'trainlog-v1';
  var BK_KEY = 'trainlog-backup';

  var app = document.getElementById('app');
  var nav = document.getElementById('nav');

  function ic(n, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dstr(new Date()); }
  function pd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmtShort(s) { var d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function fmtNum(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10).replace('.', ','); }
  function fmtInt(n) { return Math.round(n).toLocaleString('ru-RU'); }
  function num(s) { return parseFloat(String(s).replace(',', '.')); }
  function e1rm(kg, reps) { return reps <= 1 ? kg : kg * (1 + reps / 30); }
  function fmtSet(st) { return fmtNum(st.kg) + ' × ' + st.reps; }

  var state = { sessions: {}, body: [], cal: {}, plan: defaultPlan() };
  var ui = { tab: 'today', date: todayStr(), metric: 'top', exercise: null, drafts: {}, newEx: '', bwKg: '', kcalIn: '', confirmDel: null, importPending: null, loaded: false };
  var msgTimer = null;
  var installEvt = null;

  /* ---------- messages ---------- */
  function setMsg(t) {
    var el = document.getElementById('msg');
    el.textContent = t;
    el.hidden = !t;
    clearTimeout(msgTimer);
    if (t) msgTimer = setTimeout(function () { el.hidden = true; el.textContent = ''; }, 4000);
  }

  /* ---------- persistence (память браузера) ---------- */
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { setMsg('Не удалось сохранить: память браузера недоступна или заполнена. Сохрани копию на вкладке «История».'); }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var v = JSON.parse(raw); if (v && v.sessions) state = { sessions: v.sessions, body: v.body || [], cal: v.cal || {}, plan: cleanPlan(v.plan) }; }
    } catch (e) { /* пустой журнал */ }
  }
  function persistSession(date) {
    var s = state.sessions[date];
    if (s && !s.exercises.length) delete state.sessions[date];
    saveLocal();
  }
  function persistBody() { saveLocal(); }
  function persistCal() { saveLocal(); }
  function persistPlan() { saveLocal(); }
  function defaultPlan() { return { week: ['rest', 'train', 'rest', 'train', 'rest', 'train', 'rest'], days: {} }; }
  function cleanPlan(p) {
    var d = defaultPlan();
    if (p && Array.isArray(p.week) && p.week.length === 7) d.week = p.week.map(function (x) { return x === 'train' ? 'train' : 'rest'; });
    if (p && p.days && typeof p.days === 'object') Object.keys(p.days).forEach(function (k) { if (p.days[k] === 'train' || p.days[k] === 'rest') d.days[k] = p.days[k]; });
    return d;
  }

  /* ---------- derived data ---------- */
  function cur() { return state.sessions[ui.date]; }
  function ensure(date) { if (!state.sessions[date]) state.sessions[date] = { date: date, exercises: [] }; return state.sessions[date]; }
  function sortedDates() { return Object.keys(state.sessions).sort(); }
  function exVolume(sets) { var v = 0; sets.forEach(function (st) { v += st.kg * st.reps; }); return v; }
  function sessionVolume(s) { var v = 0; if (s) s.exercises.forEach(function (ex) { v += exVolume(ex.sets); }); return v; }
  function setCount(s) { var n = 0; if (s) s.exercises.forEach(function (ex) { n += ex.sets.length; }); return n; }
  function repCount(s) { var n = 0; if (s) s.exercises.forEach(function (ex) { ex.sets.forEach(function (st) { n += st.reps; }); }); return n; }
  function lastBefore(name, date) {
    var ds = sortedDates().filter(function (d) { return d < date; }).reverse();
    for (var i = 0; i < ds.length; i++) {
      var ex = state.sessions[ds[i]].exercises.find(function (e) { return e.name === name && e.sets.length; });
      if (ex) return { date: ds[i], sets: ex.sets };
    }
    return null;
  }
  function defaultsFor(name, date) {
    var s = state.sessions[date];
    var ex = s && s.exercises.find(function (e) { return e.name === name; });
    var l = null;
    if (ex && ex.sets.length) l = ex.sets[ex.sets.length - 1];
    else { var p = lastBefore(name, date); if (p) l = p.sets[p.sets.length - 1]; }
    return l ? { kg: fmtNum(l.kg), reps: String(l.reps) } : { kg: '', reps: '' };
  }
  function draftFor(name, date) { return ui.drafts[name] || defaultsFor(name, date); }
  function usedNames() {
    var last = {};
    sortedDates().forEach(function (d) {
      state.sessions[d].exercises.forEach(function (ex) { if (ex.sets.length) last[ex.name] = d; });
    });
    return Object.keys(last).sort(function (a, b) { return last[a] < last[b] ? 1 : last[a] > last[b] ? -1 : 0; });
  }
  function series(name) {
    var out = [];
    sortedDates().forEach(function (d) {
      var ex = state.sessions[d].exercises.find(function (e) { return e.name === name; });
      if (!ex || !ex.sets.length) return;
      var top = 0, est = 0;
      ex.sets.forEach(function (st) { top = Math.max(top, st.kg); est = Math.max(est, e1rm(st.kg, st.reps)); });
      out.push({ date: d, t: pd(d).getTime(), top: top, e1rm: Math.round(est * 10) / 10, vol: exVolume(ex.sets) });
    });
    return out;
  }
  function bestEst(name) {
    var b = 0;
    Object.keys(state.sessions).forEach(function (d) {
      state.sessions[d].exercises.forEach(function (ex) {
        if (ex.name === name) ex.sets.forEach(function (st) { b = Math.max(b, e1rm(st.kg, st.reps)); });
      });
    });
    return b;
  }
  function prevSessionBefore(date) {
    var ds = sortedDates().filter(function (d) { return d < date && sessionVolume(state.sessions[d]) > 0; });
    return ds.length ? ds[ds.length - 1] : null;
  }
  function pct(a, b) {
    if (!b) return null;
    var p = Math.round((a - b) / b * 100);
    return (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p) + '%';
  }
  function dayKcal(date) { var a = state.cal[date] || [], t = 0; a.forEach(function (x) { t += x; }); return t; }
  function recentKcal() {
    var out = [], ds = Object.keys(state.cal).sort().reverse();
    for (var i = 0; i < ds.length && out.length < 4; i++) {
      var a = state.cal[ds[i]];
      for (var j = a.length - 1; j >= 0 && out.length < 4; j--) if (out.indexOf(a[j]) < 0) out.push(a[j]);
    }
    return out;
  }
  function weekStart(s) { var d = pd(s), k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return dstr(d); }
  function weeklyVolume(n) {
    var base = pd(weekStart(todayStr())), out = [], idx = {}, i;
    for (i = n - 1; i >= 0; i--) {
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - 7 * i);
      out.push({ start: dstr(d), vol: 0 });
    }
    out.forEach(function (w, k) { idx[w.start] = k; });
    Object.keys(state.sessions).forEach(function (dd) {
      var k = idx[weekStart(dd)];
      if (k !== undefined) out[k].vol += sessionVolume(state.sessions[dd]);
    });
    return out;
  }
  function fmtK(v) { return v >= 1000 ? fmtNum(Math.round(v / 100) / 10) + 'к' : String(Math.round(v)); }

  var WDM = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  function wIdx(date) { return (pd(date).getDay() + 6) % 7; }
  function dayType(date) {
    if (setCount(state.sessions[date]) > 0) return 'train';
    return state.plan.days[date] || state.plan.week[wIdx(date)];
  }
  function weekDates(date) {
    var b = pd(weekStart(date)), out = [];
    for (var i = 0; i < 7; i++) out.push(dstr(new Date(b.getFullYear(), b.getMonth(), b.getDate() + i)));
    return out;
  }

  /* ---------- charts ---------- */
  function niceStep(raw) {
    var p = Math.pow(10, Math.floor(Math.log10(raw)));
    var f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function lineChart(pts, label) {
    if (!pts.length) return '';
    var W = 360, H = 200, L = 42, R = 18, T = 20, B = 28;
    var mn = Math.min.apply(null, pts.map(function (p) { return p.v; }));
    var mx = Math.max.apply(null, pts.map(function (p) { return p.v; }));
    if (mx === mn) { var pad2 = Math.max(1, Math.abs(mx) * 0.1); mn -= pad2; mx += pad2; }
    var step = niceStep((mx - mn) / 3);
    var lo = Math.floor(mn / step) * step, hi = Math.ceil(mx / step) * step;
    var t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    function X(t) { return t1 === t0 ? L + (W - L - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R); }
    function Y(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }
    var g = '';
    for (var v = lo; v <= hi + step / 2; v += step) {
      var vv = Math.round(v * 100) / 100;
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(vv) + '" y2="' + Y(vv) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text class="ax" x="' + (L - 6) + '" y="' + (Y(vv) + 4) + '" text-anchor="end">' + fmtNum(vv) + '</text>';
    }
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
    var area = pts.length > 1 ? '<path d="' + d + ' L' + X(t1).toFixed(1) + ' ' + Y(lo) + ' L' + X(t0).toFixed(1) + ' ' + Y(lo) + ' Z" fill="var(--red)" fill-opacity="0.16" stroke="none"/>' : '';
    var line = pts.length > 1 ? '<path d="' + d + '" fill="none" stroke="var(--red-hi)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '';
    var dots = pts.map(function (p, i) {
      var last = i === pts.length - 1;
      return '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (last ? 5 : 3.5) + '" fill="' + (last ? 'var(--red-hi)' : 'var(--surface)') + '" stroke="var(--red-hi)" stroke-width="2"/>';
    }).join('');
    var lp = pts[pts.length - 1], lx = X(lp.t);
    var lab = '<text class="axv" x="' + lx.toFixed(1) + '" y="' + (Y(lp.v) - 10).toFixed(1) + '" text-anchor="' + (lx > W - 44 ? 'end' : 'middle') + '">' + fmtNum(lp.v) + '</text>';
    var xl = t0 === t1
      ? '<text class="ax" x="' + X(t0) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtShort(pts[0].date) + '</text>'
      : '<text class="ax" x="' + X(t0) + '" y="' + (H - 8) + '" text-anchor="start">' + fmtShort(pts[0].date) + '</text>' +
        '<text class="ax" x="' + X(t1) + '" y="' + (H - 8) + '" text-anchor="end">' + fmtShort(lp.date) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + g + area + line + dots + lab + xl + '</svg>';
  }
  function barChart(items, label) {
    var W = 360, H = 190, L = 12, R = 12, T = 24, B = 30;
    var mx = Math.max.apply(null, items.map(function (b) { return b.v; }));
    if (!(mx > 0)) mx = 1;
    var n = items.length, slot = (W - L - R) / n, bw = Math.min(30, slot * 0.62);
    var g = '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--line)" stroke-width="1"/>';
    items.forEach(function (b, i) {
      var cx = L + slot * i + slot / 2, h = b.v / mx * (H - T - B), last = i === n - 1, y = H - B - h;
      if (b.v > 0) {
        g += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="var(--red)" fill-opacity="' + (last ? 1 : 0.5) + '"/>' +
          '<text class="' + (last ? 'axv' : 'ax') + '" x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle">' + fmtK(b.v) + '</text>';
      }
      g += '<text class="ax" x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + b.l + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + g + '</svg>';
  }

  /* ---------- views ---------- */
  function stat(icon, label, val) {
    return '<div class="stat">' + ic(icon) + '<b class="num">' + val + '</b><span>' + label + '</span></div>';
  }
  function volLine(s) {
    var v = sessionVolume(s);
    if (!v) return '';
    var d0 = prevSessionBefore(ui.date);
    if (!d0) return '<p class="exvol">' + ic('trend') + '<span>Раньше тренировок с весом не было, сравнивать пока не с чем.</span></p>';
    var pv = sessionVolume(state.sessions[d0]);
    return '<p class="exvol">' + ic('trend') + '<span>К тренировке ' + fmtShort(d0) + ' (' + fmtInt(pv) + ' кг): <b>' + pct(v, pv) + '</b></span></p>';
  }
  function exLine(ex, prev) {
    if (!ex.sets.length) return '';
    var v = exVolume(ex.sets);
    if (!v) return '<p class="exv">Подходы без веса в объём не входят.</p>';
    var pv = prev ? exVolume(prev.sets) : 0;
    return '<p class="exv">Объём упражнения: <b class="num">' + fmtInt(v) + ' кг</b>' + (pv ? ' (' + pct(v, pv) + ' к прошлому разу)' : '') + '</p>';
  }
  function stepper(kind, i, val, label, step) {
    var id = (kind === 'kg' ? 'kg-' : 'rp-') + i;
    return '<div class="f"><span>' + label + '</span><div class="stp">' +
      '<button class="ib" data-act="step" data-f="' + kind + '" data-i="' + i + '" data-d="' + (-step) + '" aria-label="Меньше, ' + label + '">' + ic('minus') + '</button>' +
      '<input id="' + id + '" inputmode="' + (kind === 'kg' ? 'decimal' : 'numeric') + '" autocomplete="off" placeholder="0" aria-label="' + label + '" value="' + esc(val) + '">' +
      '<button class="ib" data-act="step" data-f="' + kind + '" data-i="' + i + '" data-d="' + step + '" aria-label="Больше, ' + label + '">' + ic('plus') + '</button>' +
      '</div></div>';
  }
  function addCard(exs) {
    var have = exs.map(function (e) { return e.name.toLowerCase(); });
    var used = usedNames();
    var names = used.concat(PRESETS.filter(function (n) { return used.indexOf(n) < 0; }));
    var quick = names.filter(function (n) { return have.indexOf(n.toLowerCase()) < 0; }).slice(0, 8);
    return '<section class="card addcard"><h2>' + ic('plus') + 'Добавить упражнение</h2>' +
      (quick.length ? '<div class="chips">' + quick.map(function (n) {
        return '<button class="chip" data-act="addquick" data-n="' + esc(n) + '">' + ic('plus') + esc(n) + '</button>';
      }).join('') + '</div>' : '<div style="height:12px"></div>') +
      '<div class="inline"><div class="f"><span>Своё название</span><input id="new-ex" autocomplete="off" placeholder="Например, жим узким хватом" value="' + esc(ui.newEx) + '"></div>' +
      '<button class="sec" data-act="addex" aria-label="Добавить своё упражнение">' + ic('plus') + 'Добавить</button></div></section>';
  }
  function kcalCard() {
    var arr = state.cal[ui.date] || [], tot = dayKcal(ui.date), freq = recentKcal();
    return '<section class="card"><div class="kc"><h2>' + ic('flame') + 'Калории</h2><span class="tot">' + fmtInt(tot) + '<i>ккал</i></span></div>' +
      (arr.length
        ? '<ul class="cl">' + arr.map(function (k, i) {
            return '<li><span>' + fmtInt(k) + '<i>ккал</i></span><button class="ib ghost" data-act="kdel" data-k="' + i + '" aria-label="Удалить запись ' + fmtInt(k) + ' ккал">' + ic('trash') + '</button></li>';
          }).join('') + '</ul>'
        : '<p class="prev" style="margin-top:10px">На этот день калорий пока нет. Впиши приём пищи или сразу итог за день.</p>') +
      (freq.length ? '<div class="chips" style="margin-bottom:12px">' + freq.map(function (v) {
        return '<button class="chip" data-act="kquick" data-v="' + v + '">' + ic('plus') + fmtInt(v) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="inline"><div class="f"><span>Добавить, ккал</span><input id="kcal-in" inputmode="numeric" autocomplete="off" placeholder="Например, 650" value="' + esc(ui.kcalIn) + '"></div>' +
      '<button class="pri" data-act="kadd" aria-label="Добавить калории">' + ic('plus') + 'Добавить</button></div></section>';
  }

  function weekStrip() {
    var ds = weekDates(ui.date), today = todayStr(), planned = 0, done = 0;
    var cells = ds.map(function (d, i) {
      var t = dayType(d), dn = setCount(state.sessions[d]) > 0;
      if (t === 'train') planned++;
      if (dn) done++;
      var label = WDM[i] + ' ' + pd(d).getDate() + ': ' + (dn ? 'тренировка выполнена' : t === 'train' ? 'тренировочный день' : 'день отдыха');
      return '<button class="cell ' + t + (dn ? ' done' : '') + (d === ui.date ? ' sel' : '') + (d === today ? ' today' : '') + '" data-act="gotodate" data-d="' + d + '" aria-label="' + label + '"' + (d === ui.date ? ' aria-current="date"' : '') + '>' +
        '<span class="w">' + WDM[i] + '</span><span class="n">' + pd(d).getDate() + '</span>' + ic(t === 'train' ? 'dumbbell' : 'moon') + '</button>';
    }).join('');
    return '<div class="week" role="group" aria-label="Неделя">' + cells + '</div>' +
      '<p class="weeknote">Тренировок на этой неделе: <b class="num">' + done + ' из ' + planned + '</b></p>';
  }
  function typeSeg() {
    var t = dayType(ui.date);
    return '<div class="type" role="group" aria-label="Тип дня">' +
      '<button data-act="settype" data-t="train" aria-pressed="' + (t === 'train') + '">' + ic('dumbbell') + 'Тренировка</button>' +
      '<button data-act="settype" data-t="rest" aria-pressed="' + (t === 'rest') + '">' + ic('moon') + 'Отдых</button></div>';
  }
  function restCard() {
    return '<section class="card empty">' + ic('moon', 'lg') + '<div><h2>День отдыха</h2><p>' + (ui.date === todayStr() ? 'Сегодня' : 'В этот день') +
      ' без тренировки. Калории можно записать ниже. Если решил потренироваться, нажми «Тренировка» вверху.</p></div></section>';
  }
  function planCard() {
    return '<section class="card"><div class="kc"><h2>' + ic('calendar') + 'Расписание недели</h2></div><div class="plan">' +
      state.plan.week.map(function (t, i) {
        return '<button class="cell ' + t + '" data-act="planday" data-w="' + i + '" aria-pressed="' + (t === 'train') + '" aria-label="' + WDM[i] + ': ' + (t === 'train' ? 'тренировочный день' : 'день отдыха') + '">' +
          '<span class="w">' + WDM[i] + '</span>' + ic(t === 'train' ? 'dumbbell' : 'moon') + '</button>';
      }).join('') + '</div><p class="weeknote">Так выглядят все недели по умолчанию. Нажми на день, чтобы переключить между тренировкой и отдыхом. Отдельный день можно поменять кнопками вверху страницы.</p></section>';
  }

  function viewToday() {
    var s = cur(), exs = s ? s.exercises : [];
    var d = pd(ui.date), isToday = ui.date === todayStr(), rest = dayType(ui.date) === 'rest';
    var h = '<section class="card day"><div class="daynav">' +
      '<button class="ib" data-act="dayshift" data-n="-1" aria-label="Предыдущий день">' + ic('left') + '</button>' +
      '<button class="daybtn" data-act="pickdate" aria-label="Выбрать дату"><span class="daybig"><span class="wd">' + WD[d.getDay()] + '</span><span class="dm">' + d.getDate() + ' ' + MON[d.getMonth()] + '</span></span>' + ic('calendar') + '</button>' +
      '<button class="ib" data-act="dayshift" data-n="1" aria-label="Следующий день">' + ic('right') + '</button></div>' +
      '<input class="hidden-date" type="date" id="date-input" value="' + ui.date + '" tabindex="-1" aria-hidden="true">' +
      (isToday ? '' : '<div class="todayrow"><button class="chip" data-act="today">' + ic('calendar') + 'Вернуться к сегодняшнему дню</button></div>') +
      weekStrip() + typeSeg() +
      (rest ? '' : '<div class="stats">' + stat('list', 'Подходов', setCount(s)) + stat('repeat', 'Повторов', repCount(s)) + stat('bars', 'Объём, кг', fmtInt(sessionVolume(s))) + '</div>') +
      (rest ? '' : volLine(s)) + '</section>';

    if (rest) h += restCard();
    else if (!exs.length) {
      h += '<section class="card empty">' + ic('dumbbell', 'lg') + '<div><h2>Здесь пока пусто</h2><p>Выбери упражнение ниже и записывай подходы: вес и повторы. Прошлый результат подставится сам.</p></div></section>';
    }
    (rest ? [] : exs).forEach(function (ex, i) {
      var prev = lastBefore(ex.name, ui.date), dr = draftFor(ex.name, ui.date);
      h += '<article class="card ex"><header><h2>' + esc(ex.name) + '</h2><button class="ib ghost" data-act="delex" data-i="' + i + '" aria-label="Убрать упражнение ' + esc(ex.name) + '">' + ic('trash') + '</button></header>' +
        (prev
          ? '<div class="prevrow"><span class="lbl">' + ic('clock') + 'Прошлый раз, ' + fmtShort(prev.date) + '. Нажми, чтобы подставить</span><div class="chips">' +
            prev.sets.map(function (st) { return '<button class="chip" data-act="fill" data-i="' + i + '" data-kg="' + st.kg + '" data-reps="' + st.reps + '">' + fmtSet(st) + '</button>'; }).join('') + '</div></div>'
          : '<p class="prev">Раньше это упражнение не записывалось.</p>') +
        '<ol class="sets">' + ex.sets.map(function (st, j) {
          return '<li><span class="n">' + (j + 1) + '</span><span class="v">' + fmtNum(st.kg) + '<i>кг ×</i>' + st.reps + '</span>' +
            '<button class="ib ghost" data-act="delset" data-i="' + i + '" data-j="' + j + '" aria-label="Удалить подход ' + (j + 1) + '">' + ic('trash') + '</button></li>';
        }).join('') + '</ol>' + exLine(ex, prev) +
        '<div class="entry">' + stepper('kg', i, dr.kg, 'Вес, кг', 2.5) + stepper('rp', i, dr.reps, 'Повторы', 1) + '</div>' +
        '<button class="pri wide" data-act="addset" data-i="' + i + '">' + ic('plus') + 'Записать подход</button></article>';
    });
    h += (rest ? '' : addCard(exs)) + kcalCard() + planCard();
    return h;
  }

  function volSection() {
    var wk = weeklyVolume(8);
    var items = wk.map(function (w) { var d = pd(w.start); return { v: w.vol, l: pad(d.getDate()) + '.' + pad(d.getMonth() + 1) }; });
    var any = wk.some(function (w) { return w.vol > 0; });
    var avg4 = (wk[3].vol + wk[4].vol + wk[5].vol + wk[6].vol) / 4;
    return '<div class="sect"><h2>' + ic('bars') + 'Объём по неделям</h2><span>кг за неделю</span></div>' +
      '<div class="tiles"><div class="tile">' + ic('calendar') + '<span>Эта неделя</span><b>' + fmtInt(wk[7].vol) + '</b></div>' +
      '<div class="tile">' + ic('clock') + '<span>Прошлая</span><b>' + fmtInt(wk[6].vol) + '</b></div>' +
      '<div class="tile">' + ic('repeat') + '<span>Среднее, 4 нед.</span><b>' + fmtInt(avg4) + '</b></div></div>' +
      '<section class="card chartbox">' + (any ? barChart(items, 'Объём тренировок по неделям, кг') : '') +
      '<p class="note">' + (any
        ? 'Объём: вес × повторы по всем упражнениям, подходы без веса не считаются. Неделя идёт с понедельника, под столбцом дата понедельника. Среднее считается по четырём полным неделям до текущей.'
        : 'Запиши подходы с весом, и здесь появятся недели.') + '</p></section>';
  }
  function kcalSection() {
    var DAY = 864e5, t = pd(todayStr()).getTime();
    var ds = Object.keys(state.cal).filter(function (d) { return dayKcal(d) > 0; }).sort();
    function age(d) { return Math.round((t - pd(d).getTime()) / DAY); }
    var recent = ds.filter(function (d) { return age(d) <= 13; });
    var last7 = ds.filter(function (d) { return age(d) <= 6; });
    var avg7 = last7.length ? last7.reduce(function (a, d) { return a + dayKcal(d); }, 0) / last7.length : 0;
    var pts = recent.map(function (d) { return { t: pd(d).getTime(), date: d, v: dayKcal(d) }; });
    var lastD = ds.length ? ds[ds.length - 1] : null;
    return '<div class="sect"><h2>' + ic('flame') + 'Калории</h2><span>ккал в день</span></div>' +
      '<div class="tiles"><div class="tile">' + ic('repeat') + '<span>Среднее, 7 дн.</span><b>' + (last7.length ? fmtInt(avg7) : '—') + '</b></div>' +
      '<div class="tile">' + ic('clock') + '<span>Последний день</span><b>' + (lastD ? fmtInt(dayKcal(lastD)) : '—') + '</b></div>' +
      '<div class="tile">' + ic('calendar') + '<span>Записано дней</span><b>' + recent.length + ' из 14</b></div></div>' +
      '<section class="card chartbox">' + (pts.length ? lineChart(pts, 'Калории по дням, ккал') : '') +
      '<p class="note">' + (pts.length
        ? 'График за последние 14 дней, среднее по дням с записями. Калории вносятся на вкладке «Сегодня», внизу страницы.'
        : 'Впиши калории на вкладке «Сегодня», внизу страницы, и здесь появится график.') + '</p></section>';
  }

  function viewProgress() {
    var names = usedNames();
    var h = '';
    if (!names.length) {
      h += '<section class="card empty">' + ic('trend', 'lg') + '<div><h2>График появится после записи</h2><p>Запиши подходы на вкладке «Сегодня». Для линии роста нужны хотя бы два занятия с одним упражнением.</p></div></section>';
    } else {
      if (!ui.exercise || names.indexOf(ui.exercise) < 0) ui.exercise = names[0];
      var ser = series(ui.exercise);
      var key = ui.metric;
      var titles = { top: 'Рабочий вес', e1rm: 'Расч. максимум', vol: 'Объём' };
      var pts = ser.map(function (p) { return { t: p.t, date: p.date, v: p[key] }; });
      var bestSet = null, bestE = 0, bestKg = 0;
      Object.keys(state.sessions).forEach(function (d) {
        state.sessions[d].exercises.forEach(function (ex) {
          if (ex.name !== ui.exercise) return;
          ex.sets.forEach(function (st) {
            var e = e1rm(st.kg, st.reps);
            if (!bestSet || e > bestE || (e === bestE && st.kg > bestKg)) { bestSet = st; bestE = e; bestKg = st.kg; }
          });
        });
      });
      var delta = pts.length > 1 ? pts[pts.length - 1].v - pts[0].v : null;
      var dtxt = delta === null ? '—' : (delta > 0 ? '+' : delta < 0 ? '−' : '') + fmtNum(Math.abs(Math.round(delta * 10) / 10)) + ' кг';
      h += '<div class="chiprow" role="group" aria-label="Упражнение">' + names.map(function (n) {
          return '<button class="chip' + (n === ui.exercise ? ' on' : '') + '" data-act="pickex" data-n="' + esc(n) + '" aria-pressed="' + (n === ui.exercise) + '">' + esc(n) + '</button>';
        }).join('') + '</div>' +
        '<div class="seg" role="group" aria-label="Показатель">' +
        ['top', 'e1rm', 'vol'].map(function (m) { return '<button data-act="metric" data-m="' + m + '" aria-pressed="' + (m === key) + '">' + titles[m] + '</button>'; }).join('') + '</div>' +
        '<div class="tiles"><div class="tile">' + ic('trophy') + '<span>Лучший подход</span><b>' + (bestSet ? fmtSet(bestSet) : '—') + '</b></div>' +
        '<div class="tile">' + ic('dumbbell') + '<span>Расч. максимум</span><b>' + fmtNum(Math.round(bestE * 10) / 10) + ' кг</b></div>' +
        '<div class="tile">' + ic('trend') + '<span>Динамика</span><b>' + dtxt + '</b></div></div>' +
        '<section class="card chartbox">' + lineChart(pts, titles[key] + ', ' + ui.exercise + ', кг') +
        '<p class="note">' + (pts.length < 2 ? 'Нужно минимум два занятия, чтобы увидеть линию. ' : '') +
        (key === 'e1rm' ? 'Расчёт по формуле Эпли: вес × (1 + повторы ÷ 30), по введённому весу. ' : '') +
        (key === 'vol' ? 'Объём: сумма вес × повторы за занятие. ' : '') + 'Занятий: ' + pts.length + '.</p></section>';
    }
    h += volSection() + kcalSection();
    var bw = state.body.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var bpts = bw.map(function (e) { return { t: pd(e.date).getTime(), date: e.date, v: e.kg }; });
    var lastB = bw.length ? bw[bw.length - 1] : null;
    var chg = bw.length > 1 ? lastB.kg - bw[0].kg : null;
    h += '<div class="sect"><h2>' + ic('scale') + 'Вес тела</h2><span class="num">' + (lastB ? fmtNum(lastB.kg) + ' кг' + (chg !== null ? ', ' + (chg > 0 ? '+' : chg < 0 ? '−' : '') + fmtNum(Math.abs(Math.round(chg * 10) / 10)) + ' за период' : '') : '') + '</span></div>' +
      '<section class="card"><div class="inline"><div class="f"><span>Сегодня, кг</span><input id="bw-kg" inputmode="decimal" autocomplete="off" placeholder="Например, 81,5" value="' + esc(ui.bwKg) + '"></div>' +
      '<button class="pri" data-act="bwadd" aria-label="Записать вес тела">' + ic('plus') + 'Записать</button></div>' +
      (bpts.length ? '<div class="chartbox">' + lineChart(bpts, 'Вес тела, кг') + '</div><ul class="bwlist">' +
        bw.slice(-5).reverse().map(function (e) {
          var k = state.body.findIndex(function (x) { return x.date === e.date; });
          return '<li><span>' + fmtShort(e.date) + '</span><b class="num">' + fmtNum(e.kg) + ' кг</b><button class="ib ghost" data-act="bwdel" data-k="' + k + '" aria-label="Удалить запись от ' + fmtShort(e.date) + '">' + ic('trash') + '</button></li>';
        }).join('') + '</ul>' : '<p class="note" style="margin-left:0">Записи веса появятся здесь в виде графика.</p>') + '</section>';
    return h;
  }

  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function summary(st) {
    var n = 0;
    Object.keys(st.sessions).forEach(function (d) { if (setCount(st.sessions[d]) > 0) n++; });
    return 'тренировок: ' + n + ', записей веса: ' + st.body.length + ', дней с калориями: ' + Object.keys(st.cal).length;
  }
  function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function lastBackup() { try { return localStorage.getItem(BK_KEY) || ''; } catch (e) { return ''; } }
  function dataCard() {
    var lb = lastBackup();
    var h = '<section class="card data"><div class="kc"><h2>' + ic('download') + 'Резервная копия</h2></div>' +
      '<p class="note0">Все записи хранятся только на этом телефоне. Если очистить данные браузера или удалить приложение, они пропадут. Время от времени сохраняй копию в файл. ' + (lb ? 'Последняя копия: ' + fmtShort(lb) + '.' : 'Копий пока не было.') + '</p>' +
      '<p class="note0">Сейчас в журнале: ' + summary(state) + '.</p>';
    if (ui.importPending) {
      h += '<div class="warn"><p><b>Заменить данные в журнале?</b> В файле: ' + summary(ui.importPending) + '. То, что записано сейчас, будет заменено.</p>' +
        '<div class="acts"><button class="danger" data-act="importyes">' + ic('upload') + 'Заменить</button><button class="sec" data-act="importno">Отмена</button></div></div>';
    } else {
      h += '<div class="acts" style="margin-top:12px"><button class="pri" data-act="export">' + ic('download') + 'Сохранить копию</button>' +
        '<button class="sec" data-act="import">' + ic('upload') + 'Загрузить из копии</button></div>';
    }
    if (!isStandalone()) {
      if (installEvt) h += '<div class="acts" style="margin-top:10px"><button class="sec" data-act="install">' + ic('plus') + 'Установить приложение</button></div>';
      else if (isIOS()) h += '<p class="note0" style="margin-top:12px">Чтобы поставить на экран iPhone, открой страницу в Safari, нажми «Поделиться» и выбери «На экран “Домой”».</p>';
    }
    return h + '</section>';
  }
  function sanitize(o) {
    if (!o || typeof o !== 'object' || !o.sessions || typeof o.sessions !== 'object') throw new Error('bad file');
    var out = { sessions: {}, body: [], cal: {}, plan: cleanPlan(o.plan) };
    Object.keys(o.sessions).forEach(function (d) {
      var s = o.sessions[d];
      if (!DATE_RE.test(d) || !s || !Array.isArray(s.exercises)) return;
      var exs = [];
      s.exercises.forEach(function (ex) {
        if (!ex || typeof ex.name !== 'string' || !Array.isArray(ex.sets)) return;
        var sets = [];
        ex.sets.forEach(function (st) { if (st && isFinite(st.kg) && isFinite(st.reps) && +st.kg >= 0 && +st.reps >= 1) sets.push({ kg: +st.kg, reps: Math.round(+st.reps) }); });
        exs.push({ name: ex.name.slice(0, 120), sets: sets });
      });
      out.sessions[d] = { date: d, exercises: exs };
    });
    (Array.isArray(o.body) ? o.body : []).forEach(function (e) { if (e && DATE_RE.test(e.date) && isFinite(e.kg)) out.body.push({ date: e.date, kg: +e.kg }); });
    if (o.cal && typeof o.cal === 'object') Object.keys(o.cal).forEach(function (d) {
      if (!DATE_RE.test(d) || !Array.isArray(o.cal[d])) return;
      var a = o.cal[d].filter(function (x) { return isFinite(x) && +x > 0; }).map(Number);
      if (a.length) out.cal[d] = a;
    });
    return out;
  }
  function readImport(inp) {
    var f = inp.files && inp.files[0];
    inp.value = '';
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var obj = JSON.parse(String(rd.result));
        ui.importPending = sanitize(obj && obj.data ? obj.data : obj);
        ui.tab = 'history';
        render();
        window.scrollTo(0, document.body.scrollHeight);
      } catch (err) { setMsg('Не получилось прочитать файл. Нужна копия, сохранённая этим приложением.'); }
    };
    rd.onerror = function () { setMsg('Не получилось открыть файл.'); };
    rd.readAsText(f);
  }
  function markBackup() { try { localStorage.setItem(BK_KEY, todayStr()); } catch (e) { /* не страшно */ } render(); }
  function exportData() {
    var text = JSON.stringify({ app: 'trainlog', version: 1, exported: new Date().toISOString(), data: state }, null, 1);
    var name = 'trainlog-' + todayStr() + '.json', file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) { file = null; }
    function download() {
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      markBackup();
      setMsg('Копия сохранена: ' + name);
    }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Копия журнала' }).then(markBackup).catch(function (err) { if (!err || err.name !== 'AbortError') download(); });
    } else download();
  }

  function viewHistory() { return historyList() + dataCard(); }
  function historyList() {
    var ds = sortedDates().filter(function (d) { return setCount(state.sessions[d]) > 0; }).reverse();
    if (!ds.length) return '<section class="card empty">' + ic('clock', 'lg') + '<div><h2>История пуста</h2><p>Законченные тренировки будут собираться здесь, самые свежие сверху.</p></div></section>';
    return ds.map(function (d) {
      var s = state.sessions[d], dt = pd(d);
      return '<article class="card sess"><header><h3>' + ic('calendar') + WD[dt.getDay()] + ', ' + dt.getDate() + ' ' + MON[dt.getMonth()] + '</h3>' +
        '<span class="vol num">' + setCount(s) + ' подх. · ' + fmtInt(sessionVolume(s)) + ' кг' + (dayKcal(d) ? ' · ' + fmtInt(dayKcal(d)) + ' ккал' : '') + '</span></header><ul>' +
        s.exercises.filter(function (ex) { return ex.sets.length; }).map(function (ex) {
          return '<li><b>' + esc(ex.name) + '</b><span class="num">' + ex.sets.map(fmtSet).join(' · ') + '</span></li>';
        }).join('') + '</ul><div class="acts"><button class="sec" data-act="opendate" data-d="' + d + '">Открыть' + ic('right') + '</button>' +
        (ui.confirmDel === d
          ? '<button class="danger" data-act="delyes" data-d="' + d + '">' + ic('trash') + 'Удалить насовсем</button><button class="sec" data-act="delno">Отмена</button>'
          : '<button class="ib ghost" data-act="delask" data-d="' + d + '" aria-label="Удалить тренировку">' + ic('trash') + '</button>') + '</div></article>';
    }).join('');
  }

  function render() {
    var a = document.activeElement, fid = a && a.id, ss = null, se = null;
    try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) { /* not a text input */ }
    document.getElementById('where').textContent = ui.loaded ? 'данные на этом телефоне' : '';
    if (!ui.loaded) app.innerHTML = '<section class="card empty">' + ic('clock', 'lg') + '<div><p>Загружаю записи…</p></div></section>';
    else app.innerHTML = ui.tab === 'today' ? viewToday() : ui.tab === 'progress' ? viewProgress() : viewHistory();
    var tabs = [['today', 'dumbbell', 'Сегодня'], ['progress', 'trend', 'Прогресс'], ['history', 'clock', 'История']];
    nav.innerHTML = '<div>' + tabs.map(function (t) {
      return '<button data-act="tab" data-t="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[1]) + '<span>' + t[2] + '</span></button>';
    }).join('') + '</div>';
    if (fid) {
      var el = document.getElementById(fid);
      if (el) { el.focus(); try { if (ss !== null) el.setSelectionRange(ss, se); } catch (e) { /* ignore */ } }
    }
  }

  /* ---------- actions ---------- */
  function updateDraft(i) {
    var s = cur(), ex = s && s.exercises[i];
    if (!ex) return;
    ui.drafts[ex.name] = { kg: document.getElementById('kg-' + i).value, reps: document.getElementById('rp-' + i).value };
  }
  function addSet(i) {
    var s = cur(), ex = s && s.exercises[i];
    if (!ex) return;
    var kgRaw = document.getElementById('kg-' + i).value.trim();
    var kg = kgRaw === '' ? 0 : num(kgRaw);
    var reps = parseInt(document.getElementById('rp-' + i).value, 10);
    if (isNaN(kg) || kg < 0 || kg > 1000) { setMsg('Проверь вес: нужно число от 0 до 1000.'); return; }
    if (isNaN(reps) || reps < 1 || reps > 200) { setMsg('Проверь повторы: нужно целое число от 1 до 200.'); return; }
    var prevBest = bestEst(ex.name);
    ex.sets.push({ kg: Math.round(kg * 100) / 100, reps: reps });
    ui.drafts[ex.name] = { kg: fmtNum(kg), reps: String(reps) };
    persistSession(ui.date);
    var est = e1rm(kg, reps);
    if (prevBest > 0 && est > prevBest + 0.05) setMsg('Рекорд: расчётный максимум ' + fmtNum(Math.round(est * 10) / 10) + ' кг.');
    render();
  }
  function addExercise(raw) {
    var name = String(raw).trim().replace(/\s+/g, ' ');
    if (!name) { setMsg('Впиши название упражнения.'); return false; }
    var sess = ensure(ui.date);
    if (sess.exercises.some(function (x) { return x.name.toLowerCase() === name.toLowerCase(); })) { setMsg('Это упражнение уже есть в тренировке.'); return false; }
    var known = PRESETS.concat(usedNames()).filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
    sess.exercises.push({ name: known || name, sets: [] });
    persistSession(ui.date);
    return true;
  }
  function addKcal(v) {
    var k = Math.round(v);
    if (isNaN(k) || k < 1 || k > 20000) { setMsg('Проверь калории: нужно число от 1 до 20000.'); return false; }
    (state.cal[ui.date] = state.cal[ui.date] || []).push(k);
    persistCal();
    return true;
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.dataset.act, i = +b.dataset.i, s = cur();
    if (a === 'tab') { ui.tab = b.dataset.t; ui.confirmDel = null; render(); window.scrollTo(0, 0); }
    else if (a === 'today') { ui.date = todayStr(); render(); }
    else if (a === 'gotodate') { ui.date = b.dataset.d; render(); }
    else if (a === 'settype') {
      var ty = b.dataset.t;
      if (ty === 'rest' && setCount(s) > 0) { setMsg('В этот день уже есть подходы. Удали их, чтобы сделать день отдыхом.'); return; }
      if (ty === state.plan.week[wIdx(ui.date)]) delete state.plan.days[ui.date]; else state.plan.days[ui.date] = ty;
      persistPlan();
      render();
    }
    else if (a === 'planday') {
      var wi = +b.dataset.w;
      state.plan.week[wi] = state.plan.week[wi] === 'train' ? 'rest' : 'train';
      persistPlan();
      render();
    }
    else if (a === 'dayshift') { var dd = pd(ui.date); dd.setDate(dd.getDate() + (+b.dataset.n)); ui.date = dstr(dd); render(); }
    else if (a === 'pickdate') {
      var inp = document.getElementById('date-input');
      try { inp.showPicker(); } catch (err) { try { inp.focus(); inp.click(); } catch (err2) { /* use the arrows */ } }
    }
    else if (a === 'addset') addSet(i);
    else if (a === 'fill') {
      document.getElementById('kg-' + i).value = fmtNum(+b.dataset.kg);
      document.getElementById('rp-' + i).value = b.dataset.reps;
      updateDraft(i);
    }
    else if (a === 'step') {
      var f = b.dataset.f, field = document.getElementById((f === 'kg' ? 'kg-' : 'rp-') + i);
      var v = num(field.value);
      if (isNaN(v)) v = 0;
      v += parseFloat(b.dataset.d);
      v = f === 'kg' ? Math.max(0, Math.round(v * 100) / 100) : Math.max(1, Math.round(v));
      field.value = fmtNum(v);
      updateDraft(i);
    }
    else if (a === 'delset') { s.exercises[i].sets.splice(+b.dataset.j, 1); persistSession(ui.date); render(); }
    else if (a === 'delex') { s.exercises.splice(i, 1); persistSession(ui.date); render(); }
    else if (a === 'addquick') { if (addExercise(b.dataset.n)) render(); }
    else if (a === 'addex') { if (addExercise(ui.newEx)) { ui.newEx = ''; render(); } }
    else if (a === 'metric') { ui.metric = b.dataset.m; render(); }
    else if (a === 'pickex') { ui.exercise = b.dataset.n; render(); }
    else if (a === 'bwadd') {
      var kg = num(ui.bwKg);
      if (isNaN(kg) || kg < 20 || kg > 400) { setMsg('Проверь вес тела: нужно число от 20 до 400.'); return; }
      var t = todayStr();
      state.body = state.body.filter(function (x) { return x.date !== t; });
      state.body.push({ date: t, kg: Math.round(kg * 10) / 10 });
      ui.bwKg = '';
      persistBody();
      render();
    }
    else if (a === 'bwdel') { state.body.splice(+b.dataset.k, 1); persistBody(); render(); }
    else if (a === 'kadd') { if (addKcal(num(ui.kcalIn))) { ui.kcalIn = ''; render(); } }
    else if (a === 'kquick') { if (addKcal(+b.dataset.v)) render(); }
    else if (a === 'kdel') {
      var ka = state.cal[ui.date];
      if (ka) { ka.splice(+b.dataset.k, 1); if (!ka.length) delete state.cal[ui.date]; }
      persistCal();
      render();
    }
    else if (a === 'export') exportData();
    else if (a === 'import') document.getElementById('import-file').click();
    else if (a === 'importyes') {
      state = ui.importPending; ui.importPending = null; ui.drafts = {};
      saveLocal(); setMsg('Данные загружены.'); render();
    }
    else if (a === 'importno') { ui.importPending = null; render(); }
    else if (a === 'install') {
      if (installEvt) { var ev = installEvt; ev.prompt(); ev.userChoice.then(function () { installEvt = null; render(); }); }
    }
    else if (a === 'opendate') { ui.date = b.dataset.d; ui.tab = 'today'; render(); window.scrollTo(0, 0); }
    else if (a === 'delask') { ui.confirmDel = b.dataset.d; render(); }
    else if (a === 'delno') { ui.confirmDel = null; render(); }
    else if (a === 'delyes') {
      var d = b.dataset.d;
      if (state.sessions[d]) state.sessions[d].exercises = [];
      ui.confirmDel = null;
      persistSession(d);
      render();
    }
  });

  document.addEventListener('input', function (e) {
    var id = e.target.id || '';
    if (id.indexOf('kg-') === 0 || id.indexOf('rp-') === 0) updateDraft(+id.slice(3));
    else if (id === 'new-ex') ui.newEx = e.target.value;
    else if (id === 'bw-kg') ui.bwKg = e.target.value;
    else if (id === 'kcal-in') ui.kcalIn = e.target.value;
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'date-input' && e.target.value) { ui.date = e.target.value; render(); }
    else if (e.target.id === 'import-file') readImport(e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var id = e.target.id || '';
    if (id.indexOf('kg-') === 0 || id.indexOf('rp-') === 0) { e.preventDefault(); addSet(+id.slice(3)); }
    else if (id === 'new-ex' || id === 'bw-kg' || id === 'kcal-in') {
      e.preventDefault();
      var btn = document.querySelector('[data-act="' + ({ 'new-ex': 'addex', 'bw-kg': 'bwadd', 'kcal-in': 'kadd' })[id] + '"]');
      if (btn) btn.click();
    }
  });

  /* ---------- start ---------- */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (ui.loaded && ui.tab === 'history') render(); });
  window.addEventListener('appinstalled', function () { installEvt = null; if (ui.loaded) render(); });

  function init() {
    loadLocal();
    ui.loaded = true;
    render();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* не страшно */ }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* без офлайн-режима */ }); });
    }
  }
  init();
})();
</script>
</body>
</html>
